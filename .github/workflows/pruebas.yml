# Integracion continua del Sistema Integral para Colectivos.
# Corre en cada pull request hacia main y en cada cambio que entra a main.
# Levanta PostgreSQL 16 y MongoDB 7 con el mismo docker-compose.yml del
# equipo y ejecuta: analisis estatico, compilacion, pruebas unitarias, de
# integracion, de integridad de ambas bases, npm audit y busqueda de secretos.
# Ademas levanta el despliegue de produccion completo (Caddy, API y bases)
# tal como corre en el servidor y lo prueba desde afuera por HTTPS.
# Si un paso falla, el pull request queda en rojo y no se puede unir a main.

name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Lint, unitarias e integracion
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: America/Santiago

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      # Credenciales aleatorias, solo para las bases desechables de esta
      # corrida. No hay contrasenas escritas en el repositorio.
      - name: Generar credenciales de prueba
        run: |
          PG=$(openssl rand -hex 24)
          MG=$(openssl rand -hex 24)
          echo "::add-mask::$PG"
          echo "::add-mask::$MG"
          {
            echo "POSTGRES_USUARIO=colectivos_app"
            echo "POSTGRES_CONTRASENA=$PG"
            echo "MONGO_USUARIO=colectivos_admin"
            echo "MONGO_CONTRASENA=$MG"
            echo "URL_POSTGRES=postgresql://colectivos_app:$PG@localhost:5432/colectivos"
            echo "URL_MONGO=mongodb://colectivos_admin:$MG@localhost:27017/?authSource=admin"
            echo "SECRETO_JWT=$(openssl rand -hex 32)"
            echo "NODE_ENV=test"
            echo "PUERTO=3000"
            echo "LIMITE_GENERAL_POR_MINUTO=100"
          } >> "$GITHUB_ENV"

      - name: Levantar PostgreSQL y MongoDB con datos de prueba
        run: docker compose up -d

      # Los healthcheck responden apenas parte el servidor temporal de
      # inicio, antes de que terminen los scripts de bd/*/inicio. Por eso se
      # espera el aviso de "init process complete" de cada imagen.
      - name: Esperar a que terminen los scripts de inicio
        run: |
          for i in $(seq 1 90); do
            PG=$(docker compose logs postgres | grep -c "init process complete" || true)
            MG=$(docker compose logs mongo | grep -c "init process complete" || true)
            if [ "$PG" -ge 1 ] && [ "$MG" -ge 1 ]; then
              docker compose up -d --wait
              echo "Bases listas con sus datos de prueba"
              exit 0
            fi
            sleep 2
          done
          echo "Las bases no terminaron de iniciar a tiempo"
          docker compose logs --no-color --tail=100
          exit 1

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependencias
        working-directory: api
        run: npm ci

      - name: Analisis estatico (oxlint)
        working-directory: api
        run: npm run lint

      - name: Compilar (TypeScript estricto)
        working-directory: api
        run: npm run build

      - name: Pruebas unitarias con cobertura
        working-directory: api
        run: npm run test:cov -- --ci

      - name: Pruebas de integracion contra las bases reales
        working-directory: api
        run: npm run test:e2e -- --ci

      # Las bases deben rechazar solas los datos invalidos, aunque la API
      # falle. Cada script imprime una linea OK o FALLA por comprobacion.
      - name: Integridad de PostgreSQL (restricciones CHECK, UNIQUE y FK)
        shell: bash
        run: |
          docker compose exec -T postgres psql -U "$POSTGRES_USUARIO" -d colectivos \
            -v ON_ERROR_STOP=1 -f /scripts/pruebas_integridad.sql | tee integridad.txt
          grep -q "OK" integridad.txt
          ! grep -q "FALLA" integridad.txt

      - name: Validadores de MongoDB ($jsonSchema e indice unico)
        shell: bash
        run: |
          docker compose exec -T mongo sh -c 'mongosh --quiet -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --file /scripts/pruebas_validador.js' | tee validador.txt
          grep -q "OK" validador.txt
          ! grep -q "FALLA" validador.txt

      - name: Dependencias de produccion sin vulnerabilidades altas
        working-directory: api
        run: npm audit --omit=dev --audit-level=high

      - name: Registros de las bases si algo fallo
        if: failure()
        run: docker compose logs --no-color --tail=200

  secretos:
    name: Busqueda de secretos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Descargar el codigo con todo el historial
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Revisa todos los commits: una clave subida por error queda en el
      # historial aunque despues se borre del archivo.
      - name: Buscar contrasenas, tokens y claves en el historial
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  despliegue:
    name: Despliegue de produccion (Docker y HTTPS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: despliegue
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      # Mismo script que se usa en el servidor, con un dominio local.
      - name: Generar la configuracion con secretos aleatorios
        run: bash generar-env.sh localhost

      - name: Construir la imagen de la API y levantar los cuatro servicios
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: La API responde por HTTPS a traves de Caddy
        run: |
          curl -fsSk --retry 10 --retry-delay 3 --retry-all-errors https://localhost/api/salud | tee salud.json
          grep -q '"estado":"ok"' salud.json

      - name: HTTP redirige a HTTPS
        run: |
          CODIGO=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)
          echo "HTTP responde $CODIGO"
          [[ "$CODIGO" =~ ^30[178]$ ]]

      - name: La web provisional se entrega y las rutas protegidas exigen sesion
        run: |
          curl -fsSk https://localhost/ | grep -q "Sistema Integral para Colectivos"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/usuarios/yo)" = "401"

      - name: Las bases de datos no quedan expuestas fuera de Docker
        run: |
          for puerto in 5432 27017; do
            if nc -z -w 2 127.0.0.1 "$puerto"; then
              echo "El puerto $puerto quedo abierto y no deberia"
              exit 1
            fi
          done
          echo "PostgreSQL y MongoDB no aceptan conexiones desde fuera de Docker"

      - name: La contrasena publicada de las cuentas de demostracion deja de servir
        run: |
          NUEVA=$(openssl rand -hex 16)
          echo "::add-mask::$NUEVA"
          CLAVE_DEMO="$NUEVA" bash cambiar-clave-demo.sh
          inicio() {
            curl -sk -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
              -d "{\"correo_electronico\":\"pasajero1@colectivos.ejemplo.cl\",\"contrasena\":\"$1\"}" \
              https://localhost/api/autenticacion/inicio-sesion
          }
          test "$(inicio 'Clave.Prueba.2026')" = "401"
          test "$(inicio "$NUEVA")" = "200"
          echo "La contrasena del repositorio ya no entra; la nueva si"

      - name: Respaldo de PostgreSQL y MongoDB
        run: |
          bash respaldar.sh
          for archivo in respaldos/*; do test -s "$archivo"; done

      - name: Registros de los servicios si algo fallo
        if: failure()
        run: docker compose logs --no-color --tail=200
